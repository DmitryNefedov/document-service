services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: documents
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d documents"]
      interval: 5s
      timeout: 5s
      retries: 10

  activemq:
    image: apache/activemq-classic:5.18.6
    environment:
      ACTIVEMQ_CONNECTION_USER: admin
      ACTIVEMQ_CONNECTION_PASSWORD: admin
    ports:
      - "61616:61616"   # OpenWire
      - "8161:8161"     # Web console (admin/admin)
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep 61616 | grep LISTEN || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
