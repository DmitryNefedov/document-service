plugins {
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'
targetCompatibility = '11'

repositories {
    mavenCentral()
}

ext {
    awsSdkVersion = '1.12.772'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-activemq'

    // AWS Java SDK v1
    implementation "com.amazonaws:aws-java-sdk-s3:${awsSdkVersion}"

    runtimeOnly 'org.postgresql:postgresql'

    // Unit tests: JUnit 5 + Mockito (mockito-inline for static mocking of the
    // SpringApplication bootstrap). Integration tests (*IT): Testcontainers for
    // PostgreSQL, ActiveMQ and S3 (LocalStack) - see integrationTest task below.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-inline:4.5.1'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:localstack'
    testImplementation "com.amazonaws:aws-java-sdk-core:${awsSdkVersion}"
}

// Integration tests are any *IT class; unit tests are everything else. They share
// src/test but run in separate Gradle tasks so `test` (and the JaCoCo coverage it
// feeds) stays a fast, Docker-free unit run.
def integrationTestPattern = '**/*IT.class'

tasks.named('test') {
    useJUnitPlatform()
    exclude integrationTestPattern
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
    finalizedBy 'jacocoTestReport'
}

tasks.register('integrationTest', Test) {
    description = 'Runs *IT integration tests against Testcontainers-managed infrastructure.'
    group = 'verification'
    useJUnitPlatform()
    include integrationTestPattern
    shouldRunAfter tasks.named('test')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
    // Recent dockerd (API >= 1.40) rejects docker-java's default negotiation version.
    environment 'DOCKER_API_VERSION', System.getenv().getOrDefault('DOCKER_API_VERSION', '1.44')
}

tasks.named('check') {
    dependsOn 'integrationTest', 'jacocoTestCoverageVerification', 'pitest'
}

// Mutation testing (PIT). Following Robert C. Martin's guidance in
// "Clean Craftsmanship": line coverage only proves code ran, so we also require
// that the unit tests actually *detect* deliberate faults - every injected mutant
// must be killed. The build fails below 100% mutation coverage.
pitest {
    pitestVersion = '1.15.0'
    junit5PluginVersion = '1.2.1'

    // Mutate production code only; drive it with the fast unit tests (*Test),
    // never the Docker-backed integration tests (*IT).
    targetClasses = ['com.example.documentservice.*']
    targetTests = ['com.example.documentservice.*Test']
    excludedTestClasses = ['com.example.documentservice.*IT']

    // A thorough mutation operator set (DEFAULTS plus return-value, negation,
    // increment, conditional-boundary and void-call-removal families).
    mutators = ['STRONGER']

    threads = Runtime.runtime.availableProcessors()
    timestampedReports = false
    outputFormats = ['HTML', 'XML']
    exportLineCoverage = true

    // "Aim for 100%." - fail the build on any surviving mutant or coverage gap.
    mutationThreshold = 100
    coverageThreshold = 100
    testStrengthThreshold = 100
}

jacoco {
    toolVersion = '0.8.11'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    violationRules {
        rule {
            // Unit tests are expected to cover the whole codebase.
            limit { counter = 'INSTRUCTION'; minimum = 1.0 }
            limit { counter = 'LINE'; minimum = 1.0 }
            limit { counter = 'BRANCH'; minimum = 1.0 }
            limit { counter = 'METHOD'; minimum = 1.0 }
            limit { counter = 'CLASS'; minimum = 1.0 }
        }
    }
}
