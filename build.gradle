plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    awsSdkVersion = '2.54.15'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-activemq'

    // AWS SDK for Java v2 (v1 reached end-of-life 2025-12-31).
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'

    runtimeOnly 'org.postgresql:postgresql'

    // Unit tests: JUnit 5 + Mockito (inline mock maker is the default in Mockito 5).
    // Integration tests (*IT): Testcontainers for PostgreSQL, ActiveMQ and S3
    // (LocalStack) - see the integrationTest task below.
    //
    // Spring Boot 4 modularised the test infrastructure: each technology-specific
    // test slice now ships in its own `spring-boot-starter-<tech>-test` POM (all of
    // which pull in `spring-boot-starter-test` transitively).
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    // TestRestTemplate now lives in its own module and is no longer provided by
    // @SpringBootTest automatically (see DocumentApiIT's @AutoConfigureTestRestTemplate).
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testRuntimeOnly 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-localstack'
}

// Integration tests are any *IT class; unit tests are everything else. They share
// src/test but run in separate Gradle tasks so `test` (and the JaCoCo coverage it
// feeds) stays a fast, Docker-free unit run.
def integrationTestPattern = '**/*IT.class'

tasks.named('test') {
    useJUnitPlatform()
    exclude integrationTestPattern
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
    finalizedBy 'jacocoTestReport'
}

tasks.register('integrationTest', Test) {
    description = 'Runs *IT integration tests against Testcontainers-managed infrastructure.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include integrationTestPattern
    shouldRunAfter tasks.named('test')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
    // Recent dockerd (API >= 1.40) rejects docker-java's default negotiation version.
    environment 'DOCKER_API_VERSION', System.getenv().getOrDefault('DOCKER_API_VERSION', '1.44')
}

tasks.named('check') {
    dependsOn 'integrationTest', 'jacocoTestCoverageVerification', 'pitest'
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    violationRules {
        rule {
            // Unit tests are expected to cover the whole codebase.
            limit { counter = 'INSTRUCTION'; minimum = 1.0 }
            limit { counter = 'LINE'; minimum = 1.0 }
            limit { counter = 'BRANCH'; minimum = 1.0 }
            limit { counter = 'METHOD'; minimum = 1.0 }
            limit { counter = 'CLASS'; minimum = 1.0 }
        }
    }
}

// Mutation testing (PIT). Following Robert C. Martin's guidance in
// "Clean Craftsmanship": line coverage only proves code ran, so we also require
// that the unit tests actually *detect* deliberate faults - every injected mutant
// must be killed. The build fails below 100% mutation coverage.
pitest {
    pitestVersion = '1.30.0'
    junit5PluginVersion = '1.2.3'

    targetClasses = ['com.example.documentservice.*']
    targetTests = ['com.example.documentservice.*Test']
    excludedTestClasses = ['com.example.documentservice.*IT']

    mutators = ['STRONGER']
    threads = Runtime.runtime.availableProcessors()
    timestampedReports = false
    outputFormats = ['HTML', 'XML']
    exportLineCoverage = true

    mutationThreshold = 100
    coverageThreshold = 100
    testStrengthThreshold = 100
}
